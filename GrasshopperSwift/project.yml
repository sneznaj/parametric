# project.yml — xcodegen spec for GrasshopperSwift
#
# Filament IBL assets
# --------------------
# The 3D viewport loads `default_ibl.ktx` (prefiltered reflections/irradiance)
# and `default_skybox.ktx` from `Resources/IBL/` in the app bundle, generated
# with `filament-framework/bin/cmgen --deploy=default --format=ktx` from a
# synthetic soft-key studio-sky image — no external HDRI download needed.
# To swap in a different environment, replace those two files (any equirect
# or cubemap image cmgen accepts as input works) and re-run cmgen.
#
# Without these assets, the app builds and runs but falls back to a single
# soft direct fill light (no environment reflections or diffuse IBL fill).

name: GrasshopperSwift
options:
  bundleIdPrefix: com.parametric
  deploymentTarget:
    macOS: "14.0"
  defaultConfig: Debug
  xcodeVersion: "15"

settings:
  SWIFT_VERSION: "5.10"
  MACOSX_DEPLOYMENT_TARGET: "14.0"

configs:
  Debug: debug
  Release: release

targets:
  GrasshopperSwift:
    type: application
    platform: macOS
    sources:
      - GrasshopperSwift
      - path: GrasshopperSwift/Resources/IBL
        type: folder
        buildPhase: resources
        optional: true
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.parametric.GrasshopperSwift
      PRODUCT_NAME: GrasshopperSwift
      SWIFT_VERSION: "5.10"
      INFOPLIST_FILE: GrasshopperSwift/Info.plist
      CODE_SIGN_IDENTITY: ""
      CODE_SIGNING_REQUIRED: "NO"
      CODE_SIGNING_ALLOWED: "NO"

      # Filament integration — bridging header for C++ bridge
      SWIFT_OBJC_BRIDGING_HEADER: GrasshopperSwift/GrasshopperSwift-Bridging-Header.h

      # Filament header search paths (framework is outside source tree)
      HEADER_SEARCH_PATHS:
        - $(SRCROOT)/filament-framework/include
        - $(SRCROOT)/filament-framework/include/filament
        - $(SRCROOT)/oidn-framework/include

      # Filament static library search paths
      LIBRARY_SEARCH_PATHS:
        - $(SRCROOT)/filament-framework/lib/arm64
        - $(SRCROOT)/oidn-framework/lib/arm64

      # C++ settings for Filament
      CLANG_CXX_LANGUAGE_STANDARD: c++17
      CLANG_CXX_LIBRARY: libc++

      # Linker flags — all Filament static libs + system frameworks
      # Using -Wl,-force_load for filament/backend to ensure symbols are pulled in.
      OTHER_LDFLAGS:
        - $(inherited)
        - -lfilament
        - -lbackend
        - -lutils
        - -lfilabridge
        - -lfilaflat
        - -lgeometry
        - -lshaders
        - -lsmol-v
        - -libl
        - -lfilament-iblprefilter
        - -lktxreader
        - -lzstd
        - -lmikktspace
        - -lbluegl
        - -lbluevk
        - -lcivetweb
        - -lbasis_transcoder
        - -ldracodec
        - -lstb
        - -lmeshoptimizer
        - -labseil
        - -lperfetto
        - -luberarchive
        - -luberzlib
        - -limage
        - -limageio-lite
        - -libl-lite
        - -framework OpenGL
        - -lc++
        - -framework Metal
        - -framework MetalKit
        - -framework QuartzCore
        - -framework Cocoa

    # OIDN's dylibs (unlike Filament's static .a libs) need to be embedded
    # into the app bundle to be found by @rpath at launch, not just linked.
    dependencies:
      - framework: oidn-framework/lib/arm64/libOpenImageDenoise.dylib
        embed: true
        codeSign: false
      - framework: oidn-framework/lib/arm64/libOpenImageDenoise_core.2.5.1.dylib
        embed: true
        codeSign: false
      - framework: oidn-framework/lib/arm64/libOpenImageDenoise_device_cpu.2.5.1.dylib
        embed: true
        codeSign: false
      - framework: oidn-framework/lib/arm64/libOpenImageDenoise_device_metal.2.5.1.dylib
        embed: true
        codeSign: false
      - framework: oidn-framework/lib/arm64/libtbb.12.dylib
        embed: true
        codeSign: false
    scheme:
      testTargets: []
